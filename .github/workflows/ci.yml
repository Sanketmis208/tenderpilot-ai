name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: tenderpilot_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tenderpilot_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.13.6", enable-cache: true }
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check app tests
      - name: Type check
        run: uv run mypy
      - name: Tests (unit, integration, security, evaluation gates)
        run: uv run pytest -m "not e2e" --cov=app --cov-report=term-missing:skip-covered
      - name: Dependency vulnerability audit
        run: uv export --frozen --no-dev --no-hashes > /tmp/req.txt && uvx pip-audit -r /tmp/req.txt

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., push: false, tags: "tenderpilot:ci", cache-from: type=gha, cache-to: "type=gha,mode=max" }
