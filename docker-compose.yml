# Local stack: `docker compose up --build`, then `docker compose run --rm web tenderpilot seed`.
x-app: &app
  build: .
  env_file: .env.docker
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_started }
    minio: { condition: service_started }

services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    environment: { POSTGRES_USER: tenderpilot, POSTGRES_PASSWORD: tenderpilot, POSTGRES_DB: tenderpilot }
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5433:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U tenderpilot"], interval: 5s, retries: 10 }
  redis:
    image: redis:7.4-alpine
    ports: ["6380:6379"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3; mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/tenderpilot-dev && mc anonymous set none local/tenderpilot-dev && mc version enable local/tenderpilot-dev"
  mailpit:
    image: axllent/mailpit:v1.24
    ports: ["8025:8025", "1025:1025"]
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
  web:
    <<: *app
    ports: ["8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
  worker:
    <<: *app
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "default,documents,ai,notifications", "--concurrency", "2", "--loglevel", "INFO"]
    depends_on:
      migrate: { condition: service_completed_successfully }
  beat:
    <<: *app
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  miniodata:
